<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#84A98C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Financial Tracker">

  <link rel="manifest" href="manifest.json">

  <title>Financial Tracker</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FBFAF5;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbxhZTopNC6LnOCQze_KmhHJbBDw7cyC-uFnlIWB_MxyJxzv4cl-RfZJWgSG5BVp5i5MFg/exec"
    allow="notifications">
  </iframe>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js")
          .then(function () {
            console.log("Financial Tracker service worker registered.");
          })
          .catch(function (error) {
            console.log("Service worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
